<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171d35"><meta name="apple-mobile-web-app-title" content="TRS"><meta name="application-name" content="TRS"><link rel="manifest" href="manifest.webmanifest"><title>TagesRoutineSimon</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#18213b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:235px;background:#171d35;color:white;padding:30px 18px;display:flex;flex-direction:column;gap:10px}.brand{font-size:23px;font-weight:800;margin:0 0 38px 12px}.brand span{color:#9b90ff}.nav{background:transparent;color:#aeb7d2;border:0;border-radius:12px;padding:13px 16px;text-align:left}.nav.active,.nav:hover{background:#30395a;color:white}.main{width:min(1100px,100%);margin:auto;padding:35px 40px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.muted{color:#8390a6}.h1{font-size:30px;margin:8px 0 5px}.primary{background:#6656df;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.secondary{background:white;border:1px solid #e0e4ed;border-radius:10px;padding:10px 14px;color:#303c58}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.card,.panel{background:white;border:1px solid #e8ebf2;border-radius:18px;padding:22px;box-shadow:0 4px 20px #26305408}.metric{font-size:31px;font-weight:800;margin:12px 0 3px}.panel{margin:20px 0}.progress{height:10px;border-radius:20px;background:#e9e8fc;overflow:hidden}.progress>div{height:100%;background:#6a5ce6;transition:width .2s}.tasks{display:flex;flex-direction:column;gap:10px}.task{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid #edf0f5;border-radius:13px}.task.done{background:#fafbff}.check{width:23px;height:23px;accent-color:#6756dd;flex:none}.task-main{flex:1;min-width:0}.task-title{font-weight:700}.done .task-title{text-decoration:line-through;color:#9299aa}.tag{display:inline-block;background:#f1efff;color:#6a58ce;padding:4px 9px;border-radius:8px;font-size:12px;margin-top:5px}.small{font-size:12px}.task-actions{display:flex;gap:5px}.iconbtn{border:0;background:transparent;color:#7b849b;padding:7px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.toolbar select,.toolbar input{border:1px solid #e0e4ed;background:white;border-radius:10px;padding:10px;max-width:100%}.empty{text-align:center;padding:35px;color:#8390a6}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid #e5e8f1;background:white;border-radius:10px;min-height:73px;padding:8px;text-align:left}.day.sel{outline:2px solid #6656df}.day.today{background:#f0eeff}.day .dot{display:block;height:5px;border-radius:5px;background:#6c5ddd;margin-top:12px}.dayhead{text-align:center;color:#8b95a8;font-size:12px;padding:8px}.bars{display:flex;align-items:end;gap:8px;height:165px;padding-top:15px}.barwrap{flex:1;text-align:center;font-size:11px;color:#8a94a8}.bar{background:#6d60e8;border-radius:6px 6px 0 0;min-height:3px}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.heat div{aspect-ratio:1;border-radius:4px;background:#eeeef5}.heat .l1{background:#dcd7fc}.heat .l2{background:#afa4f6}.heat .l3{background:#6e5be5}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650}.field input,.field select,.field textarea{border:1px solid #dfe3ed;border-radius:10px;padding:11px;background:white;color:#1b2540;width:100%}.wide{grid-column:1/-1}.weekdays{display:flex;gap:7px;flex-wrap:wrap}.weekday{padding:8px;border-radius:8px;background:#f0effb;border:0}.weekday.selected{background:#6656df;color:white}.modalback{position:fixed;inset:0;background:#141a3199;display:grid;place-items:center;padding:15px;z-index:5}.modal{width:min(580px,100%);max-height:95vh;overflow:auto;background:white;border-radius:18px;padding:25px}.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hidden{display:none!important}.notice{background:#fff7df;padding:14px;border-radius:12px;color:#786019}.monthnav{display:flex;gap:12px;align-items:center}.switch{display:flex;align-items:center;gap:8px}.dark{background:#11172a;color:#edf0ff}.dark .main{color:#edf0ff}.dark .card,.dark .panel,.dark .task,.dark .day,.dark .modal,.dark .secondary,.dark .toolbar select,.dark .toolbar input{background:#202943;color:#edf0ff;border-color:#35405d}.dark .field input,.dark .field select,.dark .field textarea{background:#1c2540;color:white;border-color:#46506a}.dark .task.done{background:#26314d}@media(max-width:750px){.shell{display:block}.sidebar{width:100%;position:fixed;bottom:0;left:0;z-index:3;padding:6px;display:flex;flex-direction:row;justify-content:space-around}.brand{display:none}.nav{padding:10px 5px;font-size:12px;text-align:center;flex:1}.main{padding:22px 15px 95px}.h1{font-size:25px}.cards{gap:8px}.card{padding:14px}.metric{font-size:23px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:start}.primary{padding:11px}.calendar{gap:3px}.day{min-height:60px;padding:5px}.panel{padding:15px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">✓ TagesRoutine<span>Simon</span></div><button class="nav active" data-page="today">☀ Heute</button><button class="nav" data-page="calendar">▦ Kalender</button><button class="nav" data-page="stats">▥ Statistik</button><button class="nav" data-page="tasks">☑ Aufgaben</button><button class="nav" data-page="settings">⚙ Einstellungen</button></aside><main class="main" id="app"></main></div><div id="modal-root"></div><script>
const KEY='tagesroutinesimon-v1',OLD_KEY='todo-daily-v1';const today=()=>localDate(new Date());const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=s=>new Date(s+'T12:00:00');const shift=(s,n)=>{let d=parse(s);d.setDate(d.getDate()+n);return localDate(d)};const fmt=s=>parse(s).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const defaultCats=['Gesundheit','Sport','Beruf','Weiterbildung','Haushalt','Persönlich','Sonstiges'];let state;try{state=JSON.parse(localStorage.getItem(KEY)??localStorage.getItem(OLD_KEY))}catch{}state=state&&Array.isArray(state.tasks)&&state.done?state:{tasks:[],done:{},categories:defaultCats,settings:{dark:false}};state.categories ||= defaultCats;state.settings ||= {dark:false};let page='today',selected=today(),month=today().slice(0,7),filter='all',catFilter='all',weekSelected=[1],editing=null;const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));};const weekDiff=(a,b)=>Math.floor((parse(b)-parse(a))/604800000);function scheduled(t,date){if(t.deleted||t.paused||date<t.start||(t.end&&date>t.end))return false;const d=parse(date),s=parse(t.start),dow=d.getDay(),days=Math.round((d-s)/86400000);if(t.type==='once')return date===t.start;if(t.type==='daily')return days%Math.max(1,+t.interval||1)===0;if(t.type==='weekdays')return dow>=1&&dow<=5;if(t.type==='weekend')return dow===0||dow===6;if(t.type==='weekly'){let monday=x=>{let a=parse(x);a.setDate(a.getDate()-(a.getDay()+6)%7);return a};let w=Math.round((monday(date)-monday(t.start))/604800000);return w%Math.max(1,+t.interval||1)===0&&(t.days||[s.getDay()]).includes(dow)}if(t.type==='monthly'){let diff=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();return diff>=0&&diff%Math.max(1,+t.interval||1)===0&&d.getDate()===(+t.monthday||s.getDate())}return false}const items=date=>state.tasks.filter(t=>scheduled(t,date)).sort((a,b)=>Number(!!state.done[b.id+'|'+date])-Number(!!state.done[a.id+'|'+date])||({high:0,medium:1,low:2}[a.priority]??1)-({high:0,medium:1,low:2}[b.priority]??1));const completed=(t,date)=>!!state.done[t.id+'|'+date];const pct=(n,d)=>d?Math.round(n/d*100):0;function rate(date){let a=items(date);return {all:a.length,done:a.filter(t=>completed(t,date)).length}}function title(s,sub,button=true){return `<div class="top"><div><div class="muted small">TagesRoutineSimon · Persönlicher Routineplaner</div><h1 class="h1">${s}</h1><div class="muted">${sub||''}</div></div>${button?'<button class="primary" onclick="openForm()">+ Neue Aufgabe</button>':''}</div>`}function row(t,date,manage=false){let done=completed(t,date);return `<div class="task ${done?'done':''}"><input class="check" type="checkbox" aria-label="${esc(t.title)} erledigt" ${done?'checked':''} onchange="toggle('${t.id}','${date}',this.checked)"><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="tag">${esc(t.category||'Sonstiges')}</div> <span class="muted small">${esc(repeatText(t))}${t.reminder?' · ⏰ '+esc(t.reminder):''}${t.paused?' · Pausiert':''}</span></div>${manage?`<div class="task-actions"><button class="iconbtn" title="Bearbeiten" onclick="openForm('${t.id}')">✎</button><button class="iconbtn" title="Löschen" onclick="removeTask('${t.id}')">✕</button></div>`:''}</div>`}function repeatText(t){return ({daily:'Täglich',weekdays:'Werktags',weekend:'Wochenende',weekly:'Wöchentlich',monthly:'Monatlich',once:'Einmalig'}[t.type]||'Täglich')+(+t.interval>1?' · alle '+t.interval:'')}function render(){document.body.classList.toggle('dark',!!state.settings.dark);document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const el=document.getElementById('app');if(page==='today'){let a=items(selected).filter(t=>(filter==='all'||(filter==='open'?!completed(t,selected):completed(t,selected)))&&(catFilter==='all'||t.category===catFilter)),r=rate(selected),p=pct(r.done,r.all);el.innerHTML=title('Mein Tag',fmt(selected))+`<div class="toolbar"><button class="secondary" onclick="selected=shift(selected,-1);render()">‹</button><input type="date" value="${selected}" onchange="selected=this.value;render()"><button class="secondary" onclick="selected=shift(selected,1);render()">›</button><button class="secondary" onclick="selected=today();render()">Heute</button></div><div class="cards"><div class="card"><div class="muted small">Geplant</div><div class="metric">${r.all}</div></div><div class="card"><div class="muted small">Erledigt</div><div class="metric">${r.done}</div></div><div class="card"><div class="muted small">Offen</div><div class="metric">${r.all-r.done}</div></div></div><div class="panel"><div class="top"><b>Tagesfortschritt</b><b>${p}%</b></div><div class="progress" style="margin-top:15px"><div style="width:${p}%"></div></div></div><div class="panel"><div class="top"><h3>Deine Aufgaben</h3></div><div class="toolbar"><select onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>Alle</option><option value="open" ${filter==='open'?'selected':''}>Offen</option><option value="done" ${filter==='done'?'selected':''}>Erledigt</option></select><select onchange="catFilter=this.value;render()"><option value="all">Alle Kategorien</option>${state.categories.map(c=>`<option ${catFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="tasks">${a.length?a.map(t=>row(t,selected)).join(''):'<div class="empty">Keine Aufgaben für diese Auswahl. Erstelle deine erste Routine!</div>'}</div></div>`}else if(page==='tasks'){el.innerHTML=title('Aufgaben verwalten','Routinen anlegen, bearbeiten und pausieren')+`<div class="panel"><h3>Alle Aufgaben (${state.tasks.length})</h3><div class="tasks">${state.tasks.length?state.tasks.map(t=>row(t,today(),true)).join(''):'<div class="empty">Noch keine Aufgaben angelegt.</div>'}</div></div>`}else if(page==='calendar'){let d=parse(month+'-01'),year=d.getFullYear(),m=d.getMonth(),count=new Date(year,m+1,0).getDate(),offset=(d.getDay()+6)%7;let days=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="dayhead">${x}</div>`).join('');for(let i=0;i<offset;i++)days+='<div></div>';for(let n=1;n<=count;n++){let date=localDate(new Date(year,m,n)),r=rate(date);days+=`<button class="day ${date===selected?'sel':''} ${date===today()?'today':''}" onclick="selected='${date}';page='today';render()">${n}<span class="muted small" style="display:block">${r.done}/${r.all}</span><span class="dot" style="width:${pct(r.done,r.all)}%"></span></button>`}el.innerHTML=title('Kalender','Vergangene Tage prüfen und nachträglich abhaken')+`<div class="panel"><div class="monthnav"><button class="secondary" onclick="moveMonth(-1)">‹</button><h3>${d.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h3><button class="secondary" onclick="moveMonth(1)">›</button></div><div class="calendar">${days}</div></div>`}else if(page==='stats'){let end=today(),start=shift(end,-27),weeks=[];for(let i=3;i>=0;i--){let total=0,done=0;for(let j=0;j<7;j++){let date=shift(end,-i*7-j),r=rate(date);total+=r.all;done+=r.done}weeks.push({total,done,p:pct(done,total)})}let total=weeks.reduce((a,b)=>a+b.total,0),done=weeks.reduce((a,b)=>a+b.done,0);let heat='';for(let i=97;i>=0;i--){let r=rate(shift(end,-i)),p=pct(r.done,r.all);heat+=`<div class="${p>=80?'l3':p>=40?'l2':p>0?'l1':''}" title="${shift(end,-i)}: ${r.done}/${r.all}"></div>`}el.innerHTML=title('Statistik','Deine Entwicklung in den letzten 28 Tagen',false)+`<div class="cards"><div class="card"><div class="muted small">Erfüllungsquote</div><div class="metric">${pct(done,total)}%</div></div><div class="card"><div class="muted small">Erledigungen</div><div class="metric">${done}</div></div><div class="card"><div class="muted small">Geplant</div><div class="metric">${total}</div></div></div><div class="panel"><h3>Wochenvergleich</h3><div class="bars">${weeks.map((w,i)=>`<div class="barwrap"><b>${w.p}%</b><div class="bar" style="height:${Math.max(3,w.p*1.3)}px"></div><div>Woche ${i+1}</div></div>`).join('')}</div></div><div class="panel"><h3>Aktivität der letzten 14 Wochen</h3><div class="heat">${heat}</div><p class="muted small">Je dunkler das Feld, desto höher die Erfüllungsquote.</p></div><div class="panel"><h3>Erfüllung nach Aufgabe · 28 Tage</h3>${state.tasks.map(t=>{let n=0,k=0;for(let i=27;i>=0;i--){let dt=shift(end,-i);if(scheduled(t,dt)){n++;if(completed(t,dt))k++}}return `<div style="margin:17px 0"><div class="top"><span>${esc(t.title)}</span><b>${pct(k,n)}% <span class="muted small">(${k}/${n})</span></b></div><div class="progress" style="margin-top:8px"><div style="width:${pct(k,n)}%"></div></div></div>`}).join('')||'<div class="empty">Lege Aufgaben an, um Statistiken zu sehen.</div>'}</div>`}else{el.innerHTML=title('Einstellungen','Darstellung, Datensicherung und Benachrichtigungen',false)+`<div class="panel"><h3>Darstellung</h3><label class="switch"><input type="checkbox" ${state.settings.dark?'checked':''} onchange="state.settings.dark=this.checked;save();render()"> Dunkelmodus</label></div><div class="panel"><h3>Daten sichern</h3><p class="muted">Alle Daten liegen derzeit lokal in diesem Browser. Ein Export sichert Aufgaben und Erledigungen.</p><div class="toolbar"><button class="secondary" onclick="exportData()">↓ JSON-Backup exportieren</button><button class="secondary" onclick="exportCSV()">↓ CSV-Erledigungen</button><label class="secondary" style="cursor:pointer">↑ Backup importieren<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label></div></div><div class="panel"><h3>Benachrichtigungen</h3><p class="muted">Erinnerungen funktionieren in dieser Version nur, solange die Anwendung geöffnet ist. Für zuverlässige Hintergrund-Benachrichtigungen ist eine weitere Android-Integration nötig.</p><button class="secondary" onclick="askNotifications()">Benachrichtigungen erlauben</button></div><div class="panel"><h3>Kategorien</h3><div class="toolbar">${state.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div><button class="secondary" onclick="addCategory()">+ Kategorie hinzufügen</button></div><div class="notice">Geräteübergreifende Synchronisierung und Cloud-Anmeldung sind in dieser lokalen Version noch nicht enthalten.</div>`}}function toggle(id,date,yes){let key=id+'|'+date;if(yes)state.done[key]=new Date().toISOString();else delete state.done[key];save();render()}function moveMonth(n){let d=parse(month+'-01');d.setMonth(d.getMonth()+n);month=localDate(d).slice(0,7);render()}function openForm(id){editing=id||null;let t=state.tasks.find(t=>t.id===id)||{title:'',description:'',category:'Gesundheit',type:'daily',interval:1,days:[1],start:today(),end:'',priority:'medium',reminder:'',paused:false};weekSelected=[...(t.days||[1])];document.getElementById('modal-root').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeForm()"><div class="modal"><div class="top"><h2>${id?'Aufgabe bearbeiten':'Neue Aufgabe'}</h2><button class="iconbtn" onclick="closeForm()">✕</button></div><form id="taskform" onsubmit="submitTask(event)"><div class="formgrid"><label class="field wide">Titel *<input name="title" required maxlength="120" value="${esc(t.title)}" placeholder="z. B. 30 Minuten Sport"></label><label class="field wide">Beschreibung<textarea name="description" rows="2">${esc(t.description)}</textarea></label><label class="field">Kategorie<select name="category">${state.categories.map(c=>`<option ${c===t.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label class="field">Priorität<select name="priority"><option value="low" ${t.priority==='low'?'selected':''}>Niedrig</option><option value="medium" ${t.priority==='medium'?'selected':''}>Normal</option><option value="high" ${t.priority==='high'?'selected':''}>Hoch</option></select></label><label class="field">Wiederholung<select name="type" onchange="updateRepeat()">${[['daily','Jeden Tag / alle X Tage'],['weekdays','Werktags'],['weekend','Wochenende'],['weekly','Wöchentlich / bestimmte Tage'],['monthly','Monatlich'],['once','Einmalig']].map(([v,s])=>`<option value="${v}" ${v===t.type?'selected':''}>${s}</option>`).join('')}</select></label><label class="field" id="intervalField">Intervall<input name="interval" type="number" min="1" max="365" value="${t.interval||1}"></label><div class="field wide" id="weekdayField"><span>Wochentage</span><div class="weekdays">${['So','Mo','Di','Mi','Do','Fr','Sa'].map((x,i)=>`<button type="button" class="weekday ${weekSelected.includes(i)?'selected':''}" onclick="chooseDay(${i},this)">${x}</button>`).join('')}</div></div><label class="field" id="monthdayField">Tag im Monat<input name="monthday" type="number" min="1" max="31" value="${t.monthday||parse(t.start).getDate()}"></label><label class="field">Start / Fälligkeit<input name="start" type="date" required value="${t.start}"></label><label class="field">Enddatum (optional)<input name="end" type="date" value="${t.end||''}"></label><label class="field">Erinnerung (optional)<input name="reminder" type="time" value="${t.reminder||''}"></label><label class="field" style="justify-content:end"><span><input type="checkbox" name="paused" ${t.paused?'checked':''}> Pausiert</span></label></div><div class="footer-actions"><button type="button" class="secondary" onclick="closeForm()">Abbrechen</button><button class="primary" type="submit">Speichern</button></div></form></div></div>`;updateRepeat()}function updateRepeat(){let v=document.querySelector('[name=type]').value;document.getElementById('weekdayField').classList.toggle('hidden',v!=='weekly');document.getElementById('monthdayField').classList.toggle('hidden',v!=='monthly');document.getElementById('intervalField').classList.toggle('hidden',!['daily','weekly','monthly'].includes(v))}function chooseDay(i,el){weekSelected=weekSelected.includes(i)?weekSelected.filter(x=>x!==i):[...weekSelected,i];el.classList.toggle('selected')}function closeForm(){document.getElementById('modal-root').innerHTML=''}function submitTask(e){e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f).entries());if(o.end&&o.end<o.start){alert('Das Enddatum darf nicht vor dem Start liegen.');return}if(o.type==='weekly'&&!weekSelected.length){alert('Bitte mindestens einen Wochentag auswählen.');return}o.title=o.title.trim();if(!o.title)return;o.interval=Math.max(1,Number(o.interval)||1);o.monthday=Math.min(31,Math.max(1,Number(o.monthday)||1));o.days=weekSelected;o.paused=f.elements.paused.checked;let old=state.tasks.find(x=>x.id===editing);if(old)Object.assign(old,o);else state.tasks.push({...o,id:uid()});save();closeForm();render()}function removeTask(id){if(confirm('Aufgabe wirklich löschen? Historische Erledigungen werden im Backup weiterhin gespeichert, aber nicht mehr ausgewertet.')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}}function addCategory(){let c=prompt('Name der neuen Kategorie:')?.trim();if(c&&!state.categories.includes(c)){state.categories.push(c);save();render()}}function exportData(){download('tagesroutinesimon-backup.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json')}function download(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCSV(){let lines=['Aufgabe;Datum;Erledigt am'];for(let [key,value] of Object.entries(state.done)){let [id,date]=key.split('|'),t=state.tasks.find(t=>t.id===id);lines.push(`"${(t?.title||'Gelöschte Aufgabe').replaceAll('"','""')}";${date};${value}`)}download('tagesroutinesimon-erledigungen.csv','\ufeff'+lines.join('\n'),'text/csv;charset=utf-8')}async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.tasks)||!x.done||typeof x.done!=='object')throw Error();if(confirm('Vorhandene Daten durch dieses Backup ersetzen?')){state={tasks:x.tasks,done:x.done,categories:Array.isArray(x.categories)?x.categories:defaultCats,settings:x.settings||{dark:false}};save();render()}}catch{alert('Ungültige Backup-Datei.')}}async function askNotifications(){if(!('Notification'in window)){alert('Benachrichtigungen werden hier nicht unterstützt.');return}let p=await Notification.requestPermission();alert(p==='granted'?'Benachrichtigungen erlaubt. Erinnerungen funktionieren bei geöffneter App.':'Benachrichtigungen nicht erlaubt.')}let sent=new Set();function checkReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;let now=new Date(),hm=now.toTimeString().slice(0,5),date=today();for(let t of items(date)){let k=t.id+'|'+date;if(t.reminder===hm&&!completed(t,date)&&!sent.has(k)){new Notification('TagesRoutineSimon: '+t.title,{body:'Deine Aufgabe ist noch offen.'});sent.add(k)}}}setInterval(checkReminders,30000);document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>{page=x.dataset.page;render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
